<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>FuZz TestMode — Command Palette mockup</title>
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="mockup-6-command-palette.css">
</head>
<body>
<div class="pickbar">
  <span class="num">UX 1 / 5</span><strong>Command Palette</strong>
  <span class="note">— Raycast/Spotlight-style: dashboard home, ⌘K search, slide-in inspector</span>
  <span class="sp"></span><a href="index2.html">← all 5 (round 2)</a>
</div>

<div class="topbar">
  <div class="brand">FuZz<span>TestMode</span></div>
  <div class="devswitch">
    <button id="dev-diffuser" class="on">Diffuser</button>
    <button id="dev-smarttv">SmartTV</button>
  </div>
  <div class="topbar-right">
    <span id="conn-dot" class="conn-dot">●</span>
    <span id="conn-ip" class="conn-ip"></span>
    <button id="keepalive-btn" class="icon-btn" title="Toggle keep-alive">⟳</button>
    <button id="activity-btn" class="icon-btn" title="Activity log">☰<span id="activity-badge" class="badge hidden">0</span></button>
  </div>
</div>

<div class="page">
  <div class="hero">
    <div class="hero-label">DEVICE STATUS</div>
    <div id="stat-tiles" class="stat-tiles"></div>
  </div>

  <button id="search-trigger" class="search-trigger">
    <span class="sicon">⌕</span> Search commands…
    <span class="kbd">⌘K</span>
  </button>

  <div class="section">
    <div class="section-title">Quick actions</div>
    <div id="quick-actions" class="quick-actions"></div>
  </div>

  <div class="section">
    <div class="section-title">Recent activity</div>
    <div id="recent-activity" class="recent-activity"></div>
  </div>
</div>

<div id="palette-overlay" class="palette-overlay hidden">
  <div class="palette">
    <div class="palette-input-row">
      <span class="sicon">⌕</span>
      <input id="palette-input" type="text" placeholder="Type a command name, id, or category…" autocomplete="off">
      <span class="kbd">esc</span>
    </div>
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>

<div id="inspector-drawer" class="drawer">
  <div class="drawer-head">
    <div id="drawer-title" class="drawer-title"></div>
    <button id="drawer-close" class="icon-btn">✕</button>
  </div>
  <div id="drawer-content" class="drawer-content"></div>
</div>
<div id="drawer-scrim" class="scrim hidden"></div>

<div id="activity-drawer" class="activity-drawer">
  <div class="drawer-head">
    <div class="drawer-title">Activity log</div>
    <div class="drawer-head-actions">
      <button id="activity-savelog" class="chip-btn">SaveLog</button>
      <button id="activity-close" class="icon-btn">✕</button>
    </div>
  </div>
  <div id="activity-log" class="activity-log"></div>
</div>

<script src="shared/data.js"></script>
<script src="shared/engine.js"></script>
<script src="shared/controls.js"></script>
<script src="shared/result-view.js"></script>
<script src="mockup-6-command-palette.js"></script>
</body>
</html>
