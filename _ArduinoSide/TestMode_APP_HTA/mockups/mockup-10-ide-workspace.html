<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>FuZz TestMode — IDE Workspace mockup</title>
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="mockup-10-ide-workspace.css">
</head>
<body>
<div class="pickbar">
  <span class="num">UX 5 / 5</span><strong>IDE Workspace</strong>
  <span class="note">— VS Code-style: explorer tree, multi-tab documents, bottom panel, status bar</span>
  <span class="sp"></span><a href="index2.html">← all 5 (round 2)</a>
</div>

<div class="app">
  <div class="actbar">
    <button id="dev-diffuser" class="act-btn on" title="Diffuser">D</button>
    <button id="dev-smarttv" class="act-btn" title="SmartTV">TV</button>
    <div class="act-spacer"></div>
    <button id="panel-toggle" class="act-btn small" title="Toggle bottom panel">▤</button>
  </div>

  <div class="explorer">
    <div class="explorer-title">Explorer — <span id="explorer-device"></span></div>
    <div class="explorer-filter"><input id="filter-input" type="text" placeholder="Filter…"></div>
    <div id="explorer-tree" class="explorer-tree"></div>
  </div>

  <div class="editor">
    <div id="tabstrip" class="tabstrip"></div>
    <div id="editor-body" class="editor-body"></div>

    <div id="bottom-panel" class="bottom-panel">
      <div class="bottom-tabs">
        <button id="bt-log" class="bt-tab on">LOG</button>
        <button id="bt-quicktest" class="bt-tab">QUICK TEST</button>
        <button id="bt-raw" class="bt-tab">RAW</button>
      </div>
      <div id="bp-log" class="bp-view"></div>
      <div id="bp-quicktest" class="bp-view hidden"></div>
      <div id="bp-raw" class="bp-view hidden">
        <div class="raw-row">
          <select id="raw-transport"></select>
          <input id="raw-payload" type="text" placeholder="raw payload, e.g. Ds">
          <label class="raw-env"><input id="raw-envelope" type="checkbox" checked> envelope</label>
          <button id="raw-send-btn" class="statusbar-btn">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span id="sb-conn" class="sb-item">●</span>
  <span id="sb-ip" class="sb-item"></span>
  <span class="sb-spacer"></span>
  <button id="keepalive-btn" class="sb-item sb-btn">Keep-alive: off</button>
  <button id="savelog-btn" class="sb-item sb-btn">SaveLog</button>
</div>

<script src="shared/data.js"></script>
<script src="shared/engine.js"></script>
<script src="shared/controls.js"></script>
<script src="shared/result-view.js"></script>
<script src="mockup-10-ide-workspace.js"></script>
</body>
</html>
