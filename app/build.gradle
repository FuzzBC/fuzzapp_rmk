apply plugin: 'com.android.application'

// Version state lives in version.properties (committed - it's the current
// released version, not a secret) so a build can read it, and the
// bumpVersionForNextBuild task (bottom of this file) can increment it after
// a successful release build without editing this file by hand.
def versionPropsFile = file("${rootDir}/version.properties")
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))
// -PtestVersionCode=N overrides for a one-off throwaway build (e.g. to
// install an "older" build for testing the update flow) without ever
// touching version.properties itself.
def appVersionCode = project.hasProperty('testVersionCode')
        ? project.property('testVersionCode').toInteger()
        : versionProps['versionCode'].toInteger()
def appVersionName = "1." + String.format("%03d", appVersionCode)

android {
    compileSdk 34
    //buildToolsVersion "27"
    namespace "com.fuzz.colors"
    defaultConfig {
        applicationId 'com.fuzz.colors'
        minSdk 21           // instead of minSdkVersion
        targetSdk 34        // instead of targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        signingConfig signingConfigs.debug
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable true
        }
    }
    buildFeatures {
        buildConfig true // AGP 8+ disables this by default; MainActivity reads BuildConfig.VERSION_NAME
    }
    /* 
    configurations {
        all*.exclude module: 'support-v4' // This removes all other versions of `support-v4` if gets duplicated from all the artifacts.
    }
    */

    lintOptions {
        checkReleaseBuilds false
        // Enable all deprecation warnings
        abortOnError false
    }

}

dependencies {



    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // WorkManager - schedules FuzzWidgetProvider's periodic background
    // refresh (WidgetUpdateWorker); the OS's own widget updatePeriodMillis
    // is floored at 30 min and can't hit the 15 min end of the ask.
    implementation 'androidx.work:work-runtime:2.9.1'

    // RecyclerView for displaying scrollable lists/grid UI components
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Material Components for modern UI widgets and design system
    implementation 'com.google.android.material:material:1.12.0'

    // Navigation components for in-app navigation (fragments and UI)
    implementation 'androidx.navigation:navigation-fragment:2.8.6'
    implementation 'androidx.navigation:navigation-ui:2.8.6'

    // Include all .jar files placed in the libs folder (local dependencies)
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // AppCompat for backward compatibility of Android UI components
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // ConstraintLayout for flexible, responsive UI layouts
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Library for decoding and displaying animated GIFs efficiently
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.27'

    // Uncomment if you want a color picker UI widget
    // implementation 'com.github.QuadFlask:color-picker:0.0.15'

    // Testing dependencies for Android instrumentation tests
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'               // JUnit integration for Android tests
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'  // UI testing framework

    // Glide image loading and caching library
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'  // For Glide annotations (e.g. @GlideModule)

    // Local project modules, assumed custom UI components
    // implementation project(':signseekbar')         // Custom seekbar library
    implementation project(':avloadingindicator')  // Custom loading animations

    // Animated VectorDrawable support for backward compatible animated vector graphics
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.2.0'

    // Remove duplicated Material library declaration
    // implementation 'com.google.android.material:material:1.12.0'  // Already declared above

    // Another local project module
    implementation project(':library')

    // BubbleSeekBar - a fancy seekbar UI with bubble indicators
    implementation 'com.github.woxingxiao:BubbleSeekBar:3.20'

    // Unit testing library
    testImplementation 'junit:junit:4.13.2'

    // AndroidX Test core libraries
    implementation 'androidx.test:core:1.6.1'
    implementation 'androidx.test:runner:1.6.2'
    implementation 'androidx.test:rules:1.6.1'
}

// Custom task registration to run the batch script before compiling
tasks.register('executeDeleteBuild', Exec) {                                    // Creates a new Exec type task named executeDeleteBuild
    workingDir "${rootDir}"                                                    // Instructs Gradle to look for the script in the root project folder
    commandLine 'cmd', '/c', 'DeleteBuild.bat'                                  // Calls Windows CMD to execute the requested batch routine
}                                                                              // Ends task block

// Bundles the root CHANGELOG.md into the app's assets on every build, so the
// in-app "What's new" screen (tap the "V: 1.XXX" label) always ships with
// whatever's currently committed - see CLAUDE.md for the update-it rule.
tasks.register('copyChangelog', Copy) {
    from "${rootDir}/CHANGELOG.md"
    into "${projectDir}/src/main/assets"
}

// Publishes the just-built release APK as a GitHub release (see publish_release.ps1).
// Only wired to the release variant - debug/Run-button builds never trigger this.
tasks.register('publishReleaseToGitHub', Exec) {
    workingDir "${rootDir}"
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'publish_release.ps1'
}

// Increments version.properties for the *next* build, after this one has
// already been built and published with the current number. Runs last in
// the chain so the just-published release always reflects what was actually
// built, never a version bumped out from under it.
tasks.register('bumpVersionForNextBuild') {
    doLast {
        def next = appVersionCode + 1
        versionPropsFile.text = "versionCode=${next}\n"
        println "Bumped versionCode ${appVersionCode} -> ${next} (next build will be 1.${String.format('%03d', next)})"
    }
}

// Hooking the tasks into the official Android compilation pipeline
afterEvaluate {                                                                // Executes configuration rules once the project evaluation completes
    tasks.named('preBuild').configure {                                        // Targets Android's internal initial compilation setup task
        dependsOn 'executeDeleteBuild'                                         // Tells Gradle that DeleteBuild.bat must finish executing before building begins
        dependsOn 'copyChangelog'                                              // Keep the bundled "What's new" text in sync with the repo
    }                                                                          // Ends configuration block
    tasks.named('assembleRelease').configure {
        finalizedBy 'publishReleaseToGitHub'                                   // Auto-publish once a release APK is actually built
    }
    tasks.named('publishReleaseToGitHub').configure {
        finalizedBy 'bumpVersionForNextBuild'                                  // Then roll the counter forward
    }
    // finalizedBy runs regardless of the finalized task's outcome - without this
    // guard, a failed publish (bad token, network hiccup, script bug) still
    // burns a version number with nothing actually uploaded for it.
    tasks.named('bumpVersionForNextBuild').configure {
        onlyIf { tasks.named('publishReleaseToGitHub').get().state.failure == null }
    }
}                                                                              // Ends lifecycle wrapper